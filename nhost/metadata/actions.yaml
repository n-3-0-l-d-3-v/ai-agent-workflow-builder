actions:
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/approveStep'
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{NHOST_FUNCTIONS_URL}}/actions/triggerWorkflowRun'
      forward_client_headers: true
      headers:
        - name: x-hasura-admin-secret
          value_from_env: NHOST_ADMIN_SECRET
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects:
    - name: TriggerWorkflowRunInput
    - name: ApproveStepInput
  objects:
    - name: TriggerWorkflowRunOutput
    - name: ApproveStepOutput
  scalars: []
