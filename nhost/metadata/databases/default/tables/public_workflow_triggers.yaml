table:
  name: workflow_triggers
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                _and:
                  - org_id:
                      _ceq: org_id
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
          - _or:
              - type:
                  _neq: webhook
              - _exists:
                  _table:
                    name: org_members
                    schema: public
                  _where:
                    _and:
                      - org_id:
                          _ceq: org_id
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner
      columns:
        - workflow_id
        - org_id
        - type
        - config
        - is_enabled
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - type
        - config
        - is_enabled
        - created_at
        - updated_at
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: org_id
              - user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - type
        - config
        - is_enabled
      filter:
        _and:
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                _and:
                  - org_id:
                      _ceq: org_id
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
          - _or:
              - type:
                  _neq: webhook
              - _exists:
                  _table:
                    name: org_members
                    schema: public
                  _where:
                    _and:
                      - org_id:
                          _ceq: org_id
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: org_id
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
