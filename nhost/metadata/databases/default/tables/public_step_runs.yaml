table:
  name: step_runs
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
  - name: approver
    using:
      manual_configuration:
        column_mapping:
          approved_by: id
        insertion_order: null
        remote_table:
          name: users
          schema: auth
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - org_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - finished_at
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
# Deliberately no insert/update/delete for role "user". Approving an
# approval_gate step is exposed only through the approveStep Action.
