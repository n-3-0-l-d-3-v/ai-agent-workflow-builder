table:
  schema: public
  name: step_runs
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
  - name: approver
    using:
      manual_configuration:
        remote_table:
          schema: auth
          name: users
        column_mapping:
          approved_by: id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_run_id
        - workflow_step_id
        - org_id
        - status
        - input
        - output
        - error
        - attempt_count
        - approved_by
        - approved_at
        - started_at
        - finished_at
        - created_at
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
# Deliberately no insert/update/delete for role "user". Approving an
# approval_gate step is exposed only through the approveStep Action, which
# checks the caller is an owner/editor in the run's org before writing
# approved_by/approved_at and resuming execution — see functions/actions/approveStep.ts.
