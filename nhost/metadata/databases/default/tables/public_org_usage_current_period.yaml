table:
  name: org_usage_current_period
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        column_mapping:
          org_id: id
        insertion_order: null
        remote_table:
          name: organizations
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - quota_period_start
        - quota_calls_allowed
        - quota_calls_used
        - quota_calls_remaining
        - runs_this_period
        - failed_runs_this_period
        - avg_run_duration_seconds
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
