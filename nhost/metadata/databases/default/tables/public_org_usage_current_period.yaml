table:
  name: org_usage_current_period
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - quota_period_start
        - quota_calls_allowed
        - quota_calls_used
        - quota_calls_remaining
        - runs_this_period
        - failed_runs_this_period
        - avg_run_duration_seconds
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: org_id
              - user_id:
                  _eq: X-Hasura-User-Id
