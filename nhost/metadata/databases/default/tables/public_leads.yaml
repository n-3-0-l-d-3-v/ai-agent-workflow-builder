table:
  name: leads
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
insert_permissions:
  - role: user
    permission:
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      columns:
        - org_id
        - name
        - email
        - source
        - payload
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - email
        - source
        - payload
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - email
        - source
        - payload
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
event_triggers:
  - name: start_run_on_lead_created
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 30
    webhook: '{{NHOST_FUNCTIONS_URL}}/events/leadCreated'
    headers:
      - name: x-hasura-admin-secret
        value_from_env: NHOST_ADMIN_SECRET
