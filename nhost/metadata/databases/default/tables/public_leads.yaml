table:
  schema: public
  name: leads
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - name
        - email
        - source
        - payload
        - created_at
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: user
    permission:
      # inserting a lead is what fires the database_event trigger, so any
      # editor/owner (not just owner) can create one — it's normal
      # day-to-day data entry, not a sandbox-escaping step type.
      check:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      columns:
        - org_id
        - name
        - email
        - source
        - payload
update_permissions:
  - role: user
    permission:
      columns:
        - name
        - email
        - source
        - payload
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
event_triggers:
  - name: start_run_on_lead_created
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 30
    webhook: "{{ACTIONS_BASE_URL}}/events/leadCreated"
    headers:
      - name: x-hasura-admin-secret
        value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
