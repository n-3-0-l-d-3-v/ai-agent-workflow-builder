table:
  schema: public
  name: notifications
object_relationships:
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - step_run_id
        - workflow_run_id
        - channel
        - target
        - message
        - status
        - sent_at
        - error
        - created_at
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
# Written only by the run engine (insert) and the notify event-trigger
# handler (update to sent/failed), both via admin secret.
event_triggers:
  - name: notify_on_notification_created
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 30
    webhook: "{{ACTIONS_BASE_URL}}/events/sendNotification"
    headers:
      - name: x-hasura-admin-secret
        value_from_env: HASURA_GRAPHQL_ADMIN_SECRET
