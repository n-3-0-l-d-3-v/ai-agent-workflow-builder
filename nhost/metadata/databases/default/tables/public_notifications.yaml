table:
  name: notifications
  schema: public
object_relationships:
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - step_run_id
        - workflow_run_id
        - channel
        - target
        - message
        - status
        - sent_at
        - error
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: notify_on_notification_created
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 30
    webhook: '{{NHOST_FUNCTIONS_URL}}/events/sendNotification'
    headers:
      - name: x-hasura-admin-secret
        value_from_env: NHOST_ADMIN_SECRET
