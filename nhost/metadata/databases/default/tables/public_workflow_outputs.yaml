table:
  name: workflow_outputs
  schema: public
object_relationships:
  - name: step_run
    using:
      foreign_key_constraint_on: step_run_id
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - step_run_id
        - key
        - value
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
