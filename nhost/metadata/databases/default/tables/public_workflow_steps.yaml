table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                _and:
                  - org_id:
                      _ceq: org_id
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - _exists:
                  _table:
                    name: org_members
                    schema: public
                  _where:
                    _and:
                      - org_id:
                          _ceq: org_id
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner
      columns:
        - workflow_id
        - org_id
        - step_order
        - type
        - name
        - config
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - step_order
        - type
        - name
        - config
        - created_at
        - updated_at
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: org_id
              - user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - type
        - name
        - config
      filter:
        _and:
          - _exists:
              _table:
                name: org_members
                schema: public
              _where:
                _and:
                  - org_id:
                      _ceq: org_id
                  - user_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _in:
                        - owner
                        - editor
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - _exists:
                  _table:
                    name: org_members
                    schema: public
                  _where:
                    _and:
                      - org_id:
                          _ceq: org_id
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: owner
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: org_id
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
