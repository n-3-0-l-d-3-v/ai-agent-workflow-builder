table:
  schema: public
  name: workflow_steps
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          schema: public
          name: step_runs
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - step_order
        - type
        - name
        - config
        - created_at
        - updated_at
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: user
    permission:
      # layer 2: editor/owner can add most step types, but db_write and
      # notify reach outside the sandbox (writes to arbitrary tables /
      # sends external notifications) so only an owner may add them.
      check:
        _and:
          - _exists:
              _table: { schema: public, name: org_members }
              _where:
                _and:
                  - org_id: { _ceq: org_id }
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _in: [owner, editor] }
          - _or:
              - type: { _nin: [db_write, notify] }
              - _exists:
                  _table: { schema: public, name: org_members }
                  _where:
                    _and:
                      - org_id: { _ceq: org_id }
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
      columns:
        - workflow_id
        - org_id
        - step_order
        - type
        - name
        - config
update_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - type
        - name
        - config
      filter:
        _and:
          - _exists:
              _table: { schema: public, name: org_members }
              _where:
                _and:
                  - org_id: { _ceq: org_id }
                  - user_id: { _eq: X-Hasura-User-Id }
                  - role: { _in: [owner, editor] }
          - _or:
              - type: { _nin: [db_write, notify] }
              - _exists:
                  _table: { schema: public, name: org_members }
                  _where:
                    _and:
                      - org_id: { _ceq: org_id }
                      - user_id: { _eq: X-Hasura-User-Id }
                      - role: { _eq: owner }
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table: { schema: public, name: org_members }
          _where:
            _and:
              - org_id: { _ceq: org_id }
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _in: [owner, editor] }
