table:
  schema: public
  name: organizations
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: org_members
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          schema: public
          name: workflows
object_relationships:
  - name: usage
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: org_usage_current_period
        column_mapping:
          id: org_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_start
        - created_by
        - created_at
        - updated_at
      filter:
        _exists:
          _table:
            schema: public
            name: org_members
          _where:
            _and:
              - org_id: { _ceq: id }
              - user_id: { _eq: X-Hasura-User-Id }
insert_permissions:
  - role: user
    permission:
      check:
        created_by: { _eq: X-Hasura-User-Id }
      columns:
        - name
        - slug
      set:
        created_by: x-hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        _exists:
          _table:
            schema: public
            name: org_members
          _where:
            _and:
              - org_id: { _ceq: id }
              - user_id: { _eq: X-Hasura-User-Id }
              - role: { _eq: owner }
      check: null
