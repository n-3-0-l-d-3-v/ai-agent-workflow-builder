table:
  name: organizations
  schema: public
object_relationships:
  - name: usage
    using:
      manual_configuration:
        column_mapping:
          id: org_id
        insertion_order: null
        remote_table:
          name: org_usage_current_period
          schema: public
array_relationships:
  - name: members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        created_by:
          _eq: X-Hasura-User-Id
      set:
        created_by: x-hasura-User-Id
      columns:
        - name
        - slug
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - slug
        - quota_calls_allowed
        - quota_calls_used
        - quota_period_start
        - created_by
        - created_at
        - updated_at
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: id
              - user_id:
                  _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        _exists:
          _table:
            name: org_members
            schema: public
          _where:
            _and:
              - org_id:
                  _ceq: id
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      check: null
