table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - trigger_type
        - triggered_by
        - trigger_context
        - error
        - started_at
        - finished_at
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
# No insert/update/delete permissions for role "user" — a run may only be
# created and progressed by the triggerWorkflowRun / approveStep Action
# handlers (which use the admin secret).
